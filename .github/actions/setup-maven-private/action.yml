name: Setup Maven private packages
description: Configure Maven credentials and resolve private packages.

inputs:
  package-token:
    description: Token with read access to GitHub Packages.
    required: true
  publish-token:
    description: Token with write access to this repository package.
    required: false

runs:
  using: composite
  steps:
    - name: Configure package credentials
      shell: bash
      env:
        MAVEN_PACKAGE_TOKEN: ${{ inputs.package-token }}
        MAVEN_PUBLISH_TOKEN: ${{ inputs.publish-token || inputs.package-token }}
      run: |
        mkdir -p "$HOME/.m2"
        cat > "$HOME/.m2/settings.xml" <<EOF
        <settings>
          <servers>
            <server>
              <id>github-releases</id>
              <username>${GITHUB_ACTOR}</username>
              <password>${MAVEN_PUBLISH_TOKEN}</password>
            </server>
            <server>
              <id>github-jarios-parent</id>
              <username>${GITHUB_ACTOR}</username>
              <password>${MAVEN_PACKAGE_TOKEN}</password>
            </server>
            <server>
              <id>github-email-helper</id>
              <username>${GITHUB_ACTOR}</username>
              <password>${MAVEN_PACKAGE_TOKEN}</password>
            </server>
            <server>
              <id>github-properties-helper</id>
              <username>${GITHUB_ACTOR}</username>
              <password>${MAVEN_PACKAGE_TOKEN}</password>
            </server>
            <server>
              <id>github-version-helper</id>
              <username>${GITHUB_ACTOR}</username>
              <password>${MAVEN_PACKAGE_TOKEN}</password>
            </server>
            <server>
              <id>github-encrypt-helper</id>
              <username>${GITHUB_ACTOR}</username>
              <password>${MAVEN_PACKAGE_TOKEN}</password>
            </server>
          </servers>
        </settings>
        EOF

    - name: Resolve private packages
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/private-packages-pom.xml" <<'EOF'
        <project xmlns="http://maven.apache.org/POM/4.0.0"
                 xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                 xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
          <modelVersion>4.0.0</modelVersion>
          <groupId>local.jarios</groupId>
          <artifactId>private-package-resolver</artifactId>
          <version>1.0.0</version>
        </project>
        EOF

        mvn -B -f "$RUNNER_TEMP/private-packages-pom.xml" dependency:get -Dtransitive=false -Dartifact=local.jarios:jarios-parent:1.0.4:pom -DremoteRepositories=github-jarios-parent::default::https://maven.pkg.github.com/contratacionmalaga/jarios-parent
        mvn -B -f "$RUNNER_TEMP/private-packages-pom.xml" dependency:get -Dtransitive=false -Dartifact=local.jarios:encrypt-helper:7.0.2 -DremoteRepositories=github-encrypt-helper::default::https://maven.pkg.github.com/contratacionmalaga/encrypt_helper
        mvn -B -f "$RUNNER_TEMP/private-packages-pom.xml" dependency:get -Dtransitive=false -Dartifact=local.jarios:version-helper:6.1.1 -DremoteRepositories=github-version-helper::default::https://maven.pkg.github.com/contratacionmalaga/version_helper
        mvn -B -f "$RUNNER_TEMP/private-packages-pom.xml" dependency:get -Dtransitive=false -Dartifact=local.jarios:email-helper:6.1.1 -DremoteRepositories=github-email-helper::default::https://maven.pkg.github.com/contratacionmalaga/email_helper
        mvn -B -f "$RUNNER_TEMP/private-packages-pom.xml" dependency:get -Dtransitive=false -Dartifact=local.jarios:properties-helper:6.0.2 -DremoteRepositories=github-properties-helper::default::https://maven.pkg.github.com/contratacionmalaga/properties_helper
        find "$HOME/.m2/repository/local/jarios" \( -name "_remote.repositories" -o -name "*.lastUpdated" \) -delete