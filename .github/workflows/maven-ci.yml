name: Java CI with Maven

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build and quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up private Maven packages
        uses: ./.github/actions/setup-maven-private
        with:
          package-token: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and test
        run: mvn -B clean verify

      - name: SpotBugs security scan
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.9.8.2:check

      - name: OWASP dependency check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret is required for OWASP Dependency Check"
            exit 1
          fi
          mvn -B org.owasp:dependency-check-maven:check -DnvdApiKey="$NVD_API_KEY"

      - name: Upload Maven site
        if: always() && hashFiles('target/site/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: maven-site
          path: target/site

      - name: Upload dependency-check report
        if: always() && hashFiles('target/dependency-check-report.*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
