name: Java CI with Maven

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build and quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Configure package credentials
        env:
          MAVEN_PACKAGE_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>github-releases</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${MAVEN_PACKAGE_TOKEN}</password>
              </server>
              <server>
                <id>github-email-helper</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${MAVEN_PACKAGE_TOKEN}</password>
              </server>
              <server>
                <id>github-properties-helper</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${MAVEN_PACKAGE_TOKEN}</password>
              </server>
              <server>
                <id>github-version-helper</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${MAVEN_PACKAGE_TOKEN}</password>
              </server>
              <server>
                <id>github-encrypt-helper</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${MAVEN_PACKAGE_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Resolve private helper packages
        run: |
          mvn -B dependency:get -Dtransitive=false -Dartifact=local.jarios:encrypt_helper:5.2.0 -DremoteRepositories=github-encrypt-helper::default::https://maven.pkg.github.com/contratacionmalaga/encrypt_helper
          mvn -B dependency:get -Dtransitive=false -Dartifact=local.jarios:version_helper:5.2.0 -DremoteRepositories=github-version-helper::default::https://maven.pkg.github.com/contratacionmalaga/version_helper
          mvn -B dependency:get -Dtransitive=false -Dartifact=local.jarios:email_helper:5.2.0 -DremoteRepositories=github-email-helper::default::https://maven.pkg.github.com/contratacionmalaga/email_helper
          mvn -B dependency:get -Dtransitive=false -Dartifact=local.jarios:properties_helper:5.2.0 -DremoteRepositories=github-properties-helper::default::https://maven.pkg.github.com/contratacionmalaga/properties_helper
          find "$HOME/.m2/repository/local/jarios" \( -name "_remote.repositories" -o -name "*.lastUpdated" \) -delete

      - name: Build and test
        run: mvn -B clean verify

      - name: SpotBugs security scan
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.9.8.2:check

      - name: OWASP dependency check
        run: mvn -B org.owasp:dependency-check-maven:check

      - name: Upload Maven site
        if: always() && hashFiles('target/site/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: maven-site
          path: target/site

      - name: Upload dependency-check report
        if: always() && hashFiles('target/dependency-check-report.*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
