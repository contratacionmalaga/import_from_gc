name: Java CI with Maven

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: github-releases
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Configure package credentials
        run: echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"

      - name: Build and test
        run: mvn -B clean verify

      - name: SpotBugs security scan
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.9.8.2:check

      - name: OWASP dependency check
        run: mvn -B org.owasp:dependency-check-maven:check

      - name: Upload Maven site
        if: always() && hashFiles('target/site/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: maven-site
          path: target/site

      - name: Upload dependency-check report
        if: always() && hashFiles('target/dependency-check-report.*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
