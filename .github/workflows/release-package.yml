name: Release Package

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: Build and attach release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Configure package credentials
        env:
          MAVEN_PACKAGE_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github-releases</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.MAVEN_PACKAGE_TOKEN}</password>
              </server>
              <server>
                <id>github-email-helper</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.MAVEN_PACKAGE_TOKEN}</password>
              </server>
              <server>
                <id>github-properties-helper</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.MAVEN_PACKAGE_TOKEN}</password>
              </server>
              <server>
                <id>github-version-helper</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.MAVEN_PACKAGE_TOKEN}</password>
              </server>
              <server>
                <id>github-encrypt-helper</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.MAVEN_PACKAGE_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and test
        run: mvn -B clean verify

      - name: SpotBugs security scan
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.9.8.2:check

      - name: OWASP dependency check
        run: mvn -B org.owasp:dependency-check-maven:check

      - name: Publish Maven package
        run: mvn -B -DskipTests deploy

      - name: Generate checksums
        run: |
          cd target
          shasum -a 256 *.jar > checksums-sha256.txt

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            target/*-jar-with-dependencies.jar \
            target/*-sources.jar \
            target/*-javadoc.jar \
            target/checksums-sha256.txt \
            --clobber
