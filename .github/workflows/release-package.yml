name: Release Package

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: Build and attach release package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up private Maven packages
        uses: ./.github/actions/setup-maven-private
        with:
          package-token: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and test
        run: mvn -B clean verify

      - name: SpotBugs security scan
        run: mvn -B com.github.spotbugs:spotbugs-maven-plugin:4.9.8.2:check

      - name: OWASP dependency check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret is required for OWASP Dependency Check"
            exit 1
          fi
          mvn -B org.owasp:dependency-check-maven:check -DnvdApiKey="$NVD_API_KEY"

      - name: Publish Maven package
        run: mvn -B deploy

      - name: Generate checksums
        run: |
          cd target
          shasum -a 256 *.jar > checksums-sha256.txt

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            target/*-jar-with-dependencies.jar \
            target/*-sources.jar \
            target/*-javadoc.jar \
            target/checksums-sha256.txt \
            --clobber
